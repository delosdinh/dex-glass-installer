name: Publish Dex Glass Kodi installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish.yml"
      - "build/build_skin.py"
      - "build/liquid_glass.py"
      - "build/real_home.py"
      - "build/real_home_pages.py"
      - "build/dexglass_settings.py"
      - "build/inter_font.py"
      - "bridge/**"
      - "tests/**"
      - "tools/generate_assets.py"
      - "installer/generate_repo.py"
      - "README.md"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dexglass-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Package and publish Kodi repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out installer source
        uses: actions/checkout@v4

      - name: Generate open-licensed Inter typography
        run: |
          python3 -m pip install --disable-pip-version-check "fonttools==4.59.2"
          python3 build/inter_font.py

      - name: Check bridge and home-screen behaviour
        run: |
          python3 -m py_compile bridge/default.py bridge/custom_collections.py bridge/home_config.py bridge/search.py bridge/service.py build/build_skin.py build/real_home_pages.py build/dexglass_settings.py installer/generate_repo.py
          python3 -m unittest discover -s tests -v

      - name: Build original artwork
        run: python3 tools/generate_assets.py

      - name: Package standalone Kodi test skin from verified Pyrus release
        run: python3 build/build_skin.py

      - name: Build Kodi repository and installer page
        run: python3 installer/generate_repo.py

      - name: Validate site
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import xml.etree.ElementTree as ET
          out = Path("dist/site")
          root = ET.parse(out / "addons.xml").getroot()
          assert {addon.attrib["id"] for addon in root} == {"skin.dexglass", "repository.dexglass", "plugin.video.dexglass.bridge"}
          with ZipFile(out / "skin.dexglass" / "skin.dexglass-0.6.0.zip") as z:
              assert z.testzip() is None
              assert ET.fromstring(z.read("skin.dexglass/addon.xml")).get("id") == "skin.dexglass"
              home = ET.fromstring(z.read("skin.dexglass/xml/Home.xml"))
              rails=[e for e in home.iter("content") if e.text and e.text.startswith("plugin://")]
              assert len(rails)==48, rails
              assert sum("plugin.video.dexglass.bridge" in r.text for r in rails)==48
              assert b"page=watch" in z.read("skin.dexglass/xml/Home.xml")
              assert b"page=movies" in z.read("skin.dexglass/xml/Home.xml")
              assert b"page=tv" in z.read("skin.dexglass/xml/Home.xml")
              assert b"page=collections" in z.read("skin.dexglass/xml/Home.xml")
              assert b"nav-fine-focus.png" in z.read("skin.dexglass/xml/Home.xml")
              assert b"plugin.video.dexglass.bridge/?action=search" in z.read("skin.dexglass/xml/Home.xml")
              assert b"DEX  GLASS" not in z.read("skin.dexglass/xml/Home.xml")
              assert b"tvshow.clearlogo" in z.read("skin.dexglass/xml/DexGlass_Variables.xml")
              assert b"plugin.video.dexglass.bridge" in z.read("skin.dexglass/xml/SkinSettings.xml")
              assert "skin.dexglass/fonts/Inter-Regular.ttf" in z.namelist()
              assert "skin.dexglass/fonts/Inter-Semibold.ttf" in z.namelist()
              icons=[e.text for e in home.iter("texture") if (e.text or "").startswith("dexglass/icon-")]
              assert len(icons)==3, icons
              assert z.read("skin.dexglass/xml/DexGlass_Variables.xml").count(b"DG_Fanart")>0
              deps=ET.fromstring(z.read("skin.dexglass/addon.xml")).findall("requires/import")
              assert any(i.get("addon")=="plugin.video.dexglass.bridge" for i in deps)
          with ZipFile(out / "repository.dexglass" / "repository.dexglass-1.0.6.zip") as z:
              assert z.testzip() is None
          with ZipFile(out / "plugin.video.dexglass.bridge" / "plugin.video.dexglass.bridge-0.3.0.zip") as z:
              assert z.testzip() is None
              assert "plugin.video.dexglass.bridge/default.py" in z.namelist()
              assert "plugin.video.dexglass.bridge/custom_collections.py" in z.namelist()
              assert "plugin.video.dexglass.bridge/home_config.py" in z.namelist()
              assert "plugin.video.dexglass.bridge/search.py" in z.namelist()
              assert "plugin.video.dexglass.bridge/service.py" in z.namelist()
              assert any(e.get("point")=="xbmc.service" for e in ET.fromstring(z.read("plugin.video.dexglass.bridge/addon.xml")).findall("extension"))
              assert ET.fromstring(z.read("plugin.video.dexglass.bridge/addon.xml")).get("id")=="plugin.video.dexglass.bridge"
          print("Validated three add-ons and metadata for GitHub Pages")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
